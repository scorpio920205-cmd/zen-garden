<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <!-- 祥和水波漸層 -->
    <radialGradient id="waterRipple3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#80deea" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#26a69a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#00695c" stop-opacity="0"/>
    </radialGradient>
    <!-- 大荷葉漸層 (參考蓮花-01.jpg真實荷葉) -->
    <radialGradient id="bigLotusLeafGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="45%" stop-color="#2e7d32"/>
      <stop offset="85%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0e3813"/>
    </radialGradient>
    <radialGradient id="subLeafGrad" cx="45%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#81c784"/>
      <stop offset="60%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>

    <!-- 佛光瑞氣柔光 -->
    <radialGradient id="lotusAura" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#fffde7" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#fff59d" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#ffe082" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd54f" stop-opacity="0"/>
    </radialGradient>

    <!-- 花瓣漸層 (白底胭脂粉尖 · 參考蓮花-01/02實物) -->
    <!-- 外瓣漸層 -->
    <linearGradient id="outerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#f5fbf7"/>
      <stop offset="40%" stop-color="#ffffff"/>
      <stop offset="72%" stop-color="#f8bbd0"/>
      <stop offset="90%" stop-color="#ec407a"/>
      <stop offset="100%" stop-color="#c2185b"/>
    </linearGradient>
    <!-- 左傾側瓣漸層 -->
    <linearGradient id="leftPetalGrad" x1="20%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#edf7f0"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f48fb1"/>
      <stop offset="92%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </linearGradient>
    <!-- 右傾側瓣漸層 -->
    <linearGradient id="rightPetalGrad" x1="80%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#edf7f0"/>
      <stop offset="35%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f48fb1"/>
      <stop offset="92%" stop-color="#e91e63"/>
      <stop offset="100%" stop-color="#ad1457"/>
    </linearGradient>
    <!-- 內層微仰花瓣漸層 -->
    <linearGradient id="innerPetalGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="80%" stop-color="#f8bbd0"/>
      <stop offset="95%" stop-color="#f06292"/>
      <stop offset="100%" stop-color="#d81b60"/>
    </linearGradient>
    <!-- 前層低伏外翻花瓣 -->
    <linearGradient id="frontPetalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#fce4ec"/>
      <stop offset="85%" stop-color="#f48fb1"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>

    <!-- 蓮蓬中心倒圓錐漸層 -->
    <radialGradient id="podGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#cddc39"/>
      <stop offset="50%" stop-color="#afb42b"/>
      <stop offset="85%" stop-color="#827717"/>
      <stop offset="100%" stop-color="#558b2f"/>
    </radialGradient>
    <!-- 蓮蓬孔穴漸層 -->
    <radialGradient id="poreGrad" cx="40%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#33691e"/>
      <stop offset="70%" stop-color="#1b5e20"/>
      <stop offset="100%" stop-color="#0d330f"/>
    </radialGradient>

    <!-- 翡翠花梗 -->
    <linearGradient id="lotusStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="40%" stop-color="#43a047"/>
      <stop offset="85%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </linearGradient>
  </defs>

  <!-- 1. 清泉漣漪水紋 -->
  <ellipse cx="120" cy="190" rx="100" ry="28" fill="url(#waterRipple3)"/>
  <ellipse cx="120" cy="190" rx="70" ry="18" fill="none" stroke="#80deea" stroke-width="1.2" opacity="0.6"/>

  <!-- 2. 背景寬大如蓋碧綠荷葉 (參照蓮花-01.jpg的大荷葉) -->
  <!-- 左後荷葉 -->
  <g transform="translate(60, 175) rotate(-8)">
    <ellipse cx="0" cy="0" rx="55" ry="26" fill="url(#subLeafGrad)"/>
    <path d="M0 0 L-48 -10 M0 0 L-32 -20 M0 0 L-5 -25 M0 0 L28 -20 M0 0 L50 -8 M0 0 L42 15 M0 0 L20 22 M0 0 L-22 22 M0 0 L-42 12" stroke="#a5d6a7" stroke-width="1" opacity="0.6"/>
    <!-- 晶瑩露珠 -->
    <circle cx="10" cy="-6" r="3" fill="#ffffff" opacity="0.85"/>
  </g>
  <!-- 右後大荷葉 -->
  <g transform="translate(175, 170) rotate(10)">
    <ellipse cx="0" cy="0" rx="58" ry="28" fill="url(#bigLotusLeafGrad)"/>
    <path d="M0 0 L-48 -8 M0 0 L-30 -22 M0 0 L0 -26 M0 0 L32 -22 M0 0 L52 -8 M0 0 L44 18 M0 0 L18 25 M0 0 L-20 24 M0 0 L-45 12" stroke="#81c784" stroke-width="1.1" opacity="0.65"/>
    <circle cx="0" cy="0" r="3" fill="#c8e6c9"/>
    <!-- 圓滾露珠 -->
    <ellipse cx="-15" cy="5" rx="4" ry="2.8" fill="#ffffff" opacity="0.9"/>
    <circle cx="-16" cy="4.2" r="1.2" fill="#ffffff"/>
  </g>

  <!-- 3. 佛光柔和光暈 -->
  <circle cx="120" cy="115" r="75" fill="url(#lotusAura)"/>

  <!-- 4. 挺立翡翠花莖 -->
  <path d="M120 200 Q121 160 120 135" stroke="url(#lotusStem)" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  <circle cx="119" cy="180" r="0.9" fill="#1b5e20"/>
  <circle cx="121.5" cy="160" r="0.9" fill="#1b5e20"/>
  <circle cx="119.5" cy="142" r="0.9" fill="#1b5e20"/>

  <!-- 5. 聖潔重瓣盛開蓮花主體 (全貌重現蓮花-01與02) -->
  <g id="fullLotusBloom" transform="translate(120, 118)">
    
    <!-- ════ 第一層：後排盛開大花瓣 ════ -->
    <!-- 正後頂瓣 -->
    <path d="M0 12 C-20 -15 -22 -62 0 -82 C22 -62 20 -15 0 12 Z" fill="url(#outerPetalGrad)" stroke="#c2185b" stroke-width="0.7"/>
    <!-- 後左中瓣 -->
    <path d="M-8 12 C-38 -12 -58 -45 -48 -70 C-30 -58 -12 -28 -8 12 Z" fill="url(#leftPetalGrad)" stroke="#c2185b" stroke-width="0.7"/>
    <!-- 後右中瓣 -->
    <path d="M8 12 C38 -12 58 -45 48 -70 C30 -58 12 -28 8 12 Z" fill="url(#rightPetalGrad)" stroke="#c2185b" stroke-width="0.7"/>
    <!-- 後深左平展瓣 -->
    <path d="M-10 14 C-55 2 -78 -18 -82 -38 C-58 -36 -28 -10 -10 14 Z" fill="url(#leftPetalGrad)" stroke="#ad1457" stroke-width="0.7"/>
    <!-- 後深右平展瓣 -->
    <path d="M10 14 C55 2 78 -18 82 -38 C58 -36 28 -10 10 14 Z" fill="url(#rightPetalGrad)" stroke="#ad1457" stroke-width="0.7"/>

    <!-- ════ 第二層：中排立體承托瓣 ════ -->
    <!-- 中左瓣 -->
    <path d="M-8 15 C-42 0 -58 -28 -42 -52 C-24 -40 -8 -10 -8 15 Z" fill="url(#leftPetalGrad)" stroke="#e91e63" stroke-width="0.8"/>
    <!-- 中右瓣 -->
    <path d="M8 15 C42 0 58 -28 42 -52 C24 -40 8 -10 8 15 Z" fill="url(#rightPetalGrad)" stroke="#e91e63" stroke-width="0.8"/>
    <!-- 中間微仰瓣 -->
    <path d="M0 16 C-24 -2 -22 -44 0 -62 C22 -44 24 -2 0 16 Z" fill="url(#innerPetalGrad)" stroke="#e91e63" stroke-width="0.8"/>

    <!-- ════ 第三層：花心中心之「金黃雄蕊叢」與「翠綠蓮蓬」════ -->
    <!-- 金黃雄蕊底圈光暈 -->
    <ellipse cx="0" cy="5" rx="34" ry="16" fill="#ffd54f" opacity="0.6"/>

    <!-- 密布立體金黃花絲雄蕊 (Stamens - 參照蓮花-01與02黃色花蕊) -->
    <g id="stamens">
      <!-- 後圈花蕊 -->
      <line x1="-28" y1="5" x2="-34" y2="-5" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-34" cy="-5" r="1.3" fill="#fff9c4"/>
      <line x1="-20" y1="2" x2="-26" y2="-9" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-26" cy="-9" r="1.3" fill="#fff9c4"/>
      <line x1="-12" y1="0" x2="-16" y2="-12" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-16" cy="-12" r="1.3" fill="#fff9c4"/>
      <line x1="-4" y1="-2" x2="-6" y2="-14" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-6" cy="-14" r="1.3" fill="#fff9c4"/>
      <line x1="4" y1="-2" x2="6" y2="-14" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="6" cy="-14" r="1.3" fill="#fff9c4"/>
      <line x1="12" y1="0" x2="16" y2="-12" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="16" cy="-12" r="1.3" fill="#fff9c4"/>
      <line x1="20" y1="2" x2="26" y2="-9" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="26" cy="-9" r="1.3" fill="#fff9c4"/>
      <line x1="28" y1="5" x2="34" y2="-5" stroke="#fbc02d" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="34" cy="-5" r="1.3" fill="#fff9c4"/>
    </g>

    <!-- 鮮綠倒圓錐蓮蓬 (Receptacle - 參考蓮花-02清晰蓮蓬) -->
    <ellipse cx="0" cy="4" rx="16" ry="10" fill="url(#podGrad)" stroke="#558b2f" stroke-width="0.8"/>
    <!-- 蓮蓬種子孔穴 (7孔圓孔) -->
    <ellipse cx="0" cy="3" rx="2.4" ry="1.6" fill="url(#poreGrad)"/>
    <ellipse cx="-8" cy="1" rx="2.2" ry="1.5" fill="url(#poreGrad)"/>
    <ellipse cx="8" cy="1" rx="2.2" ry="1.5" fill="url(#poreGrad)"/>
    <ellipse cx="-9" cy="5" rx="2.2" ry="1.5" fill="url(#poreGrad)"/>
    <ellipse cx="9" cy="5" rx="2.2" ry="1.5" fill="url(#poreGrad)"/>
    <ellipse cx="-4" cy="7" rx="2.1" ry="1.4" fill="url(#poreGrad)"/>
    <ellipse cx="4" cy="7" rx="2.1" ry="1.4" fill="url(#poreGrad)"/>

    <!-- 前圈金黃雄蕊 (環抱蓮蓬) -->
    <g id="stamensFront">
      <line x1="-22" y1="8" x2="-26" y2="15" stroke="#ffa000" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-26" cy="15" r="1.3" fill="#fffde7"/>
      <line x1="-12" y1="11" x2="-14" y2="18" stroke="#ffa000" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="-14" cy="18" r="1.3" fill="#fffde7"/>
      <line x1="0" y1="12" x2="0" y2="19" stroke="#ffa000" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="0" cy="19" r="1.3" fill="#fffde7"/>
      <line x1="12" y1="11" x2="14" y2="18" stroke="#ffa000" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="14" cy="18" r="1.3" fill="#fffde7"/>
      <line x1="22" y1="8" x2="26" y2="15" stroke="#ffa000" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="26" cy="15" r="1.3" fill="#fffde7"/>
    </g>

    <!-- ════ 第四層：前排外翻低首花瓣 (宛若蓮花寶座，出淤泥而不染) ════ -->
    <!-- 前左斜外翻瓣 -->
    <path d="M-8 15 C-42 16 -62 30 -52 46 C-32 38 -12 26 -8 15 Z" fill="url(#frontPetalGrad)" stroke="#c2185b" stroke-width="0.8"/>
    <!-- 前右斜外翻瓣 -->
    <path d="M8 15 C42 16 62 30 52 46 C32 38 12 26 8 15 Z" fill="url(#frontPetalGrad)" stroke="#c2185b" stroke-width="0.8"/>
    <!-- 前中央下覆大瓣 -->
    <path d="M0 16 C-26 18 -28 42 0 54 C28 42 26 18 0 16 Z" fill="url(#frontPetalGrad)" stroke="#c2185b" stroke-width="0.9"/>
    
    <!-- 花瓣縱向玉潔紋理與粉紅尖暈 -->
    <path d="M0 18 Q0 38 0 52" stroke="#f48fb1" stroke-width="0.7" opacity="0.6"/>
    <path d="M-4 20 Q-8 36 0 50" stroke="#ffffff" stroke-width="0.8" opacity="0.8"/>
    <path d="M4 20 Q8 36 0 50" stroke="#ffffff" stroke-width="0.8" opacity="0.8"/>
  </g>

  <!-- 階段說明文字標籤 -->
  <text x="120" y="228" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="11.5" font-weight="700" fill="#004d40" letter-spacing="2">
    🪷 蓮花 · 第三階段【盛開聖蓮】
  </text>
</svg>
