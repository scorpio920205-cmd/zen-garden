<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 水波漸層 -->
    <radialGradient id="waterRipple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4db6ac" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#26a69a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00897b" stop-opacity="0"/>
    </radialGradient>
    <!-- 荷葉漸層 -->
    <radialGradient id="leafGrad1" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4caf50"/>
      <stop offset="65%" stop-color="#2e7d32"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <radialGradient id="leafGrad2" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#66bb6a"/>
      <stop offset="70%" stop-color="#388e3c"/>
      <stop offset="100%" stop-color="#1b5e20"/>
    </radialGradient>
    <!-- 金色菩提種子金光 -->
    <radialGradient id="seedGoldGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="1"/>
      <stop offset="35%" stop-color="#ffd54f" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#ffb300" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#ff8f00" stop-opacity="0"/>
    </radialGradient>
    <!-- 嫩芽漸層 -->
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
  </defs>

  <!-- 1. 清澈水波漣漪 -->
  <ellipse cx="100" cy="135" rx="85" ry="32" fill="url(#waterRipple)"/>
  <ellipse cx="100" cy="135" rx="60" ry="20" fill="none" stroke="#80cbc4" stroke-width="1.2" opacity="0.6" stroke-dasharray="4,3"/>
  <ellipse cx="100" cy="135" rx="35" ry="11" fill="none" stroke="#b2dfdb" stroke-width="0.8" opacity="0.7"/>

  <!-- 2. 浮水小荷葉 (右後) -->
  <g transform="translate(130, 130) rotate(-8)">
    <ellipse cx="0" cy="0" rx="28" ry="14" fill="url(#leafGrad2)"/>
    <path d="M0 0 L-26 -5 M0 0 L-18 -12 M0 0 L2 -14 M0 0 L22 -7 M0 0 L26 4 M0 0 L14 12 M0 0 L-12 13" stroke="#81c784" stroke-width="0.7" opacity="0.5"/>
    <circle cx="0" cy="0" r="1.8" fill="#a5d6a7"/>
  </g>

  <!-- 3. 主浮水荷葉 (左前) -->
  <g transform="translate(75, 140) rotate(5)">
    <ellipse cx="0" cy="0" rx="42" ry="20" fill="url(#leafGrad1)"/>
    <!-- 葉脈 -->
    <path d="M0 0 L-38 -7 M0 0 L-26 -16 M0 0 L0 -20 M0 0 L28 -15 M0 0 L39 -5 M0 0 L35 10 M0 0 L18 18 M0 0 L-15 19 M0 0 L-34 11" stroke="#a5d6a7" stroke-width="0.9" opacity="0.6"/>
    <!-- 荷葉缺口特徵 -->
    <path d="M0 0 L-42 0" stroke="#1b5e20" stroke-width="2"/>
    <circle cx="0" cy="0" r="2.5" fill="#c8e6c9"/>
    <!-- 晶瑩露珠 -->
    <ellipse cx="12" cy="-5" rx="3.5" ry="2.2" fill="#ffffff" opacity="0.85"/>
    <ellipse cx="13" cy="-5.5" rx="1.2" ry="0.8" fill="#ffffff"/>
  </g>

  <!-- 4. 水底萌生菩提金剛種子與初生卷荷嫩芽 -->
  <!-- 金光光暈 -->
  <circle cx="105" cy="108" r="32" fill="url(#seedGoldGlow)"/>
  
  <!-- 幼莖破水 -->
  <path d="M102 125 Q104 105 106 85" stroke="#388e3c" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- 幼嫩初生卷荷 (錢葉未展) -->
  <path d="M106 85 C100 80 96 70 102 62 C108 55 116 60 114 70 C112 78 108 84 106 85 Z" fill="url(#sproutGrad)" stroke="#2e7d32" stroke-width="1"/>
  <path d="M104 80 C106 72 108 66 112 63" stroke="#a5d6a7" stroke-width="0.8" fill="none"/>

  <!-- 菩提善法金種 (種子) -->
  <ellipse cx="98" cy="120" rx="7" ry="9" fill="#ffb300" stroke="#ffa000" stroke-width="1.2" transform="rotate(-15 98 120)"/>
  <ellipse cx="97" cy="118" rx="2.5" ry="4" fill="#fff9c4" opacity="0.9"/>

  <!-- 微光光點 -->
  <circle cx="90" cy="98" r="2" fill="#ffd54f"/>
  <circle cx="122" cy="90" r="1.5" fill="#fff59d"/>
  <circle cx="115" cy="115" r="2" fill="#ffecb3"/>

  <!-- 階段說明文字標籤 (底部微字) -->
  <text x="100" y="185" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="11" font-weight="600" fill="#004d40" letter-spacing="1.5">
    🪷 蓮花 · 第一階段【初芽種子】
  </text>
</svg>
