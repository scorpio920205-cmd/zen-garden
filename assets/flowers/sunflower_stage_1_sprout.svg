<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 草皮底暈 -->
    <radialGradient id="grassGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8e6c9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a5d6a7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#81c784" stop-opacity="0"/>
    </radialGradient>
    <!-- 肉質松針葉漸層 (參考太陽花-01/02肉質針葉) -->
    <linearGradient id="needleLeafGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="45%" stop-color="#4caf50"/>
      <stop offset="90%" stop-color="#81c784"/>
      <stop offset="100%" stop-color="#c8e6c9"/>
    </linearGradient>
    <!-- 肉質嫩莖漸層 -->
    <linearGradient id="succulentStem" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#388e3c"/>
      <stop offset="50%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- 金色法光種子 -->
    <radialGradient id="sunSeedGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff9c4"/>
      <stop offset="50%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. 草皮光暈與沃土生機 -->
  <ellipse cx="100" cy="150" rx="75" ry="24" fill="url(#grassGlow)"/>

  <!-- 2. 肉質匍匐嫩莖 (松葉牡丹特徵) -->
  <path d="M70 155 Q85 148 100 145 Q115 142 135 148" stroke="url(#succulentStem)" stroke-width="4.5" stroke-linecap="round" fill="none"/>
  
  <!-- 向上生長的直立小嫩枝 -->
  <path d="M100 145 Q98 120 100 95" stroke="url(#succulentStem)" stroke-width="4" stroke-linecap="round" fill="none"/>
  <path d="M88 150 Q82 132 75 118" stroke="url(#succulentStem)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <path d="M112 144 Q120 130 126 115" stroke="url(#succulentStem)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- 3. 肉質松針狀翠綠嫩葉 (圓柱形肉質葉 · 太陽花-01特徵) -->
  <!-- 左側小枝松針葉 -->
  <path d="M75 118 C65 115 58 105 56 95 C62 98 72 108 75 118 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.7"/>
  <path d="M75 118 C78 108 80 96 78 88 C74 95 72 108 75 118 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.7"/>

  <!-- 右側小枝松針葉 -->
  <path d="M126 115 C136 112 144 102 146 92 C140 96 130 105 126 115 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.7"/>
  <path d="M126 115 C124 105 122 92 125 84 C128 92 129 105 126 115 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.7"/>

  <!-- 主幹頂生松針簇 (頂端鮮嫩初萌) -->
  <path d="M100 95 C90 85 82 72 80 62 C88 68 96 82 100 95 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.8"/>
  <path d="M100 95 C110 85 118 72 120 62 C112 68 104 82 100 95 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.8"/>
  <path d="M100 95 C96 80 96 65 100 52 C104 65 104 80 100 95 Z" fill="url(#needleLeafGrad)" stroke="#1b5e20" stroke-width="0.8"/>

  <!-- 頂端破土金光與初生芽尖 (以法照心，善種破土) -->
  <circle cx="100" cy="50" r="16" fill="url(#sunSeedGlow)"/>
  <circle cx="100" cy="50" r="4" fill="#ffd54f" stroke="#ffb300" stroke-width="1"/>
  <circle cx="99" cy="49" r="1.5" fill="#ffffff"/>

  <!-- 階段說明文字標籤 -->
  <text x="100" y="185" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="11" font-weight="600" fill="#2e7d32" letter-spacing="1.5">
    🌻 太陽花 · 第一階段【初萌嫩芽】
  </text>
</svg>
