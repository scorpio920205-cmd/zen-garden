<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- 草皮底暈 -->
    <radialGradient id="grassGlow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c8e6c9" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#a5d6a7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#81c784" stop-opacity="0"/>
    </radialGradient>
    <!-- 肉質松針葉漸層 -->
    <linearGradient id="needleLeafGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="50%" stop-color="#388e3c"/>
      <stop offset="90%" stop-color="#66bb6a"/>
      <stop offset="100%" stop-color="#a5d6a7"/>
    </linearGradient>
    <!-- 肉質花莖漸層 -->
    <linearGradient id="succulentStem2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e7d32"/>
      <stop offset="50%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#2e7d32"/>
    </linearGradient>
    <!-- 圓潤花苞金紅漸層 (太陽花含苞待放) -->
    <radialGradient id="sunBudGrad" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff59d"/>
      <stop offset="35%" stop-color="#ffd54f"/>
      <stop offset="70%" stop-color="#ff9800"/>
      <stop offset="100%" stop-color="#e65100"/>
    </radialGradient>
    <!-- 苞片漸層 -->
    <linearGradient id="calyxGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1b5e20"/>
      <stop offset="60%" stop-color="#4caf50"/>
      <stop offset="100%" stop-color="#81c784"/>
    </linearGradient>
  </defs>

  <!-- 1. 草皮光暈 -->
  <ellipse cx="100" cy="165" rx="75" ry="22" fill="url(#grassGlow2)"/>

  <!-- 2. 肉質主莖向上挺立挺秀 -->
  <path d="M100 168 Q98 125 100 82" stroke="url(#succulentStem2)" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- 側生肉質小枝 -->
  <path d="M99 135 Q78 122 68 108" stroke="url(#succulentStem2)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M101 125 Q122 115 132 100" stroke="url(#succulentStem2)" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- 3. 環繞肉質松針葉 (中下層) -->
  <path d="M68 108 C55 106 46 95 44 85 C52 90 62 100 68 108 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
  <path d="M68 108 C70 95 72 82 72 74 C75 84 74 98 68 108 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
  
  <path d="M132 100 C145 96 154 85 156 75 C148 82 138 92 132 100 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
  <path d="M132 100 C130 88 128 75 128 68 C125 78 127 90 132 100 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>

  <!-- 4. 頂端輪生輪抱松針葉 (緊緊簇擁花苞) -->
  <g transform="translate(100, 80)">
    <!-- 左側托針葉 -->
    <path d="M-5 2 C-26 5 -38 -8 -45 -20 C-32 -12 -15 -4 -5 2 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
    <!-- 右側托針葉 -->
    <path d="M5 2 C26 5 38 -8 45 -20 C32 -12 15 -4 5 2 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
    <!-- 後斜托葉 -->
    <path d="M-6 -2 C-18 -18 -22 -35 -20 -48 C-14 -32 -8 -15 -6 -2 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
    <path d="M6 -2 C18 -18 22 -35 20 -48 C14 -32 8 -15 6 -2 Z" fill="url(#needleLeafGrad2)" stroke="#1b5e20" stroke-width="0.8"/>
  </g>

  <!-- 5. 圓潤飽滿太陽花蕾苞 (頂端含苞欲放) -->
  <g id="sunflowerBudCenter" transform="translate(100, 68)">
    <!-- 圓花苞外層肉質綠萼片 -->
    <ellipse cx="0" cy="0" rx="19" ry="21" fill="url(#calyxGrad)" stroke="#1b5e20" stroke-width="0.9"/>

    <!-- 萼片頂端裂開，露出金黃緊密合抱花瓣 (以經照心，光芒蓄勢待發) -->
    <path d="M0 -22 C-14 -12 -12 8 0 16 C12 8 14 -12 0 -22 Z" fill="url(#sunBudGrad)" stroke="#f57f17" stroke-width="0.8"/>
    
    <!-- 花瓣扭絞合抱紋路 -->
    <path d="M0 -22 C-8 -10 -4 4 0 16" stroke="#e65100" stroke-width="0.9" fill="none"/>
    <path d="M-4 -20 C-10 -8 -6 6 0 16" stroke="#ffb300" stroke-width="0.7" fill="none"/>
    <path d="M4 -20 C10 -8 6 6 0 16" stroke="#ffb300" stroke-width="0.7" fill="none"/>

    <!-- 前覆翠綠三角萼片 -->
    <path d="M-14 4 Q-6 16 0 17 Q6 16 14 4 Q8 -6 0 -8 Q-8 -6 -14 4 Z" fill="url(#calyxGrad)" stroke="#1b5e20" stroke-width="0.8" opacity="0.95"/>
    <path d="M0 -8 L0 16" stroke="#81c784" stroke-width="0.6"/>

    <!-- 金光蓄勢破曉之光 -->
    <circle cx="0" cy="-14" r="3" fill="#fff9c4"/>
    <circle cx="-1" cy="-15" r="1" fill="#ffffff"/>
  </g>

  <!-- 階段說明文字標籤 -->
  <text x="100" y="190" text-anchor="middle" font-family="'Noto Serif TC', serif" font-size="11" font-weight="600" fill="#e65100" letter-spacing="1.5">
    🌻 太陽花 · 第二階段【含苞圓蕾】
  </text>
</svg>
